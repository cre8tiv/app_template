[projects]
# Automatically trusts the workspace context to minimize confirmation prompts
"C:\\Projects\\featurly" = { trust_level = "trusted" }

sandbox_mode = "workspace-write"

approval_policy = "on-request"

# ----------------------------------------------------
# Multi-Agent Architecture and Model Routing
# ----------------------------------------------------
[agents.tech-lead]
config_file = ".codex/agents/tech-lead.md"
model = "gpt-5.6-sol"
reasoning_effort = "high"

[agents.code-reviewer]
config_file = ".codex/agents/code-reviewer.md"
model = "gpt-5.6-sol"
reasoning_effort = "high"

[agents.ic-generalist]
config_file = ".codex/agents/ic-generalist.md"
model = "gpt-5.6-terra"
reasoning_effort = "medium"
isolation = "worktree"

[agents.ic-specialist-backend]
config_file = ".codex/agents/ic-specialist-backend.md"
model = "gpt-5.6-terra"
reasoning_effort = "medium"
isolation = "worktree"

[runtime.prompts]
append_system_instruction = """
NOTE ON CURRENT ENVIRONMENT: You are running inside the OpenAI Codex CLI ecosystem on a GPT-5.6 series model on Windows. 
- You are strictly required to use native Windows PowerShell syntax for all terminal operations.
- DO NOT use 'cmd.exe /c' or chain environment variables with '&&'.
- To pass environment variables inline before a command, use native PowerShell sub-expression formatting:
  Example: $env:SUPABASE_API_PORT=55321; $env:SUPABASE_DB_PORT=55322; npm run supabase:start
- Your file access, Git worktree isolation, and bash tools are safely mounted via the local Codex sandbox.
"""
